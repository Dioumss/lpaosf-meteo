<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Météo LPAOSF — Sénégal</title>
  <meta name="description" content="Prévisions météo à 14 jours pour les 14 régions du Sénégal : température, pluie, vent, UV, CAPE, sol." />
  <meta name="theme-color" content="#0b5fa5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="./" data-i18n-aria="app.home" aria-label="Météo LPAOSF, accueil">
        <img src="assets/icon-192.png" alt="" width="36" height="36" />
        <span class="brand-text">
          <span class="brand-name">Météo LPAOSF</span>
          <span class="brand-sub" data-i18n="app.subtitle">Sénégal · 14 régions · 14 jours</span>
        </span>
      </a>
      <div class="header-actions">
        <span id="status" class="status" role="status" aria-live="polite">Chargement…</span>
        <button id="langBtn" class="icon-btn lang-btn" type="button" data-i18n-aria="lang.switch" data-i18n-title="lang.switch" aria-label="Switch to English" title="Switch to English">
          <span data-i18n="lang.other">EN</span>
        </button>
        <button id="refreshBtn" class="icon-btn" type="button" data-i18n-aria="refresh" data-i18n-title="refresh" aria-label="Actualiser les prévisions" title="Actualiser les prévisions">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="layout">
    <!-- Colonne carte -->
    <section class="panel map-panel" aria-labelledby="mapTitle">
      <div class="panel-head">
        <div>
          <h2 id="mapTitle" class="panel-title" data-i18n="map.title">Carte des régions</h2>
          <p id="mapSubtitle" class="panel-sub">—</p>
        </div>
        <div class="head-tools">
          <select id="regionSelect" data-i18n-aria="map.region" aria-label="Choisir une région"></select>
          <button id="locateBtn" class="icon-btn" type="button" data-i18n-aria="locate" data-i18n-title="locate" aria-label="Région la plus proche de moi" title="Région la plus proche de moi">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          </button>
          <button id="shareBtn" class="icon-btn" type="button" data-i18n-aria="share" data-i18n-title="share" aria-label="Copier le lien de cette vue" title="Copier le lien de cette vue">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
          </button>
        </div>
      </div>

      <div class="chips" id="variableChips" role="radiogroup" data-i18n-aria="map.variables" aria-label="Variable affichée"></div>

      <div class="days" id="dayStrip" role="radiogroup" data-i18n-aria="map.days" aria-label="Jour affiché"></div>

      <div class="map-wrap">
        <div id="map" data-i18n-aria="map.aria" aria-label="Carte du Sénégal par région"></div>
        <div id="mapError" class="map-error" data-i18n="map.error" hidden></div>
      </div>
      <div id="legend" class="legend" data-i18n-aria="map.legend" aria-label="Légende"></div>

      <details class="ranking">
        <summary data-i18n="ranking.title">Classement des 14 régions</summary>
        <ol id="rankingList" class="ranking-list"></ol>
      </details>
    </section>

    <!-- Colonne détail région -->
    <section class="panel detail-panel" aria-live="polite" aria-labelledby="regionName">
      <div id="detail">
        <div class="skeleton skeleton-hero"></div>
        <div class="skeleton skeleton-rows"></div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p id="footerText"></p>
    <p>Application LPAOSF · UCAD</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <template id="errorTpl">
    <div class="error-box">
      <p class="error-title" data-i18n="error.title">Impossible de charger les prévisions</p>
      <p class="error-msg"></p>
      <button type="button" class="btn retry" data-i18n="error.retry">Réessayer</button>
    </div>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
